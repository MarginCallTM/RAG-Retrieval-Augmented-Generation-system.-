[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system answering questions about the vLLM codebase"
requires-python = ">=3.10"
dependencies = [
	"pydantic>=2.0",
	"fire>=0.7",
	"tqdm>=4.66",
	"rank-bm25>=0.2.2",
	"torch>=2.4",
	"transformers>=4.51",
]

[dependency-groups]
dev = [
	"flake8>=7.0",
	"mypy>=1.10",
	"pytest>=8.0",
]

# torch comes from PyPI with CUDA bundled (about 3 GB): the project is
# run and defended on a laptop with an RTX 4050, where generation is
# 20x faster than on its CPU. The code falls back to CPU when no GPU is
# available, so `uv sync` on a CPU-only machine still works.

[tool.mypy]
exclude = '^(data|notes|\.venv)/'

# torch and transformers ship their own type information, so mypy would
# analyse both packages in full (tens of thousands of files, several
# minutes on a cold cache). Their symbols are treated as Any instead;
# src/generator.py converts what it returns explicitly.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
