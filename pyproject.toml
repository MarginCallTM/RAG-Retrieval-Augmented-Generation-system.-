[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system answering questions about the vLLM codebase"
requires-python = ">=3.10"
dependencies = [
	"pydantic>=2.0",
	"fire>=0.7",
	"tqdm>=4.66",
]

[dependency-groups]
dev = [
	"flake8>=7.0",
	"mypy>=1.10",
	"pytest>=8.0",
]

[tool.mypy]
exclude = '^(data|notes|\.venv)/'